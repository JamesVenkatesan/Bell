name: Bell
options:
  bundleIdPrefix: com.yourteam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Replace with your Apple ID's team, or leave blank and pick it in Xcode's
    # Signing & Capabilities tab after generating.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:

  Bell:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: BellApp
      - path: Resources/Events.xml
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.bell
        INFOPLIST_FILE: Support/Bell-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Bell.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: BellWidget
        embed: true

  BellWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: BellWidget
      # The same schedule file is compiled into the extension, which is what
      # lets the widget read it without an App Group.
      - path: Resources/Events.xml
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.bell.widget
        INFOPLIST_FILE: Support/BellWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/BellWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

schemes:
  Bell:
    build:
      targets:
        Bell: all
        BellWidget: all
    run:
      config: Debug
    archive:
      config: Release
